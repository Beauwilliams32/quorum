name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  standalone-command:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone-command
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone-command/package-lock.json
      - run: npm ci
      - run: npm test
